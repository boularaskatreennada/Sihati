{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIHATI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'styles/patient/login.css' %}">
  </head>
<body>
    <div class="login-container">
        <aside class="visual-sidebar">
            <div class="logo">
                <span class="logo-text">SIHATI <span class="arabic">صحتي</span></span>
            </div>
            <div class="sidebar-content">
                <h1>Bon retour sur SIHATI</h1>
                <p>Retrouvez vos rendez-vous médicaux, vos commandes et votre profil en un clic.</p>
                
            </div>
        </aside>

        <main class="login-form-section">
            <div class="login-header">
                <h2>Connexion</h2>
                <p>Pas encore de compte ? <a href="{% url 'register_patient' %}">S'inscrire gratuitement</a></p>
            </div>

            <form method="POST" class="auth-form">
    {% csrf_token %}

    <div class="form-group">
        <label>Nom d'utilisateur *</label>
        <input type="text" name="username" placeholder="ahmed.benali@email.com" required>
    </div>

    <div class="form-group">
        <label>Mot de passe *</label>
        <div class="password-wrapper">
            <input type="password" name="password" id="loginPassword" placeholder="••••••••" required>
            <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePasswordVisibility()"></i>
        </div>
    </div>

    <div class="form-options">
        <label class="checkbox-container">
            <input type="checkbox" name="remember">
            <span class="checkmark"></span>
            Se souvenir de moi
        </label>
        <a href="#" class="forgot-password">Mot de passe oublié ?</a>
    </div>

    <button type="submit" class="btn-primary">Se connecter</button>
</form>

           
        </main>
    </div>

    <script src="{% static 'js/patient/login.js' %}"></script>
</body>
</html>
