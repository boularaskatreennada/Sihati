<h2>Prendre rendez-vous avec Dr. {{ doctor.user.get_full_name }}</h2>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Confirmer le RDV
    </button>
</form>
